[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-wiki"
version = "0.1.0"
description = "A local-first knowledge wiki built from raw notes, projects, and readings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-genai>=1,<2", "pypdf>=4,<6"]

[project.optional-dependencies]
ui = ["gradio>=5,<6"]
dev = ["pytest>=8.4"]

[project.scripts]
kwiki = "knowledge_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
