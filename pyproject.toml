[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-wiki"
version = "0.1.0"
description = "A local-first knowledge wiki built from raw notes, projects, and readings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-genai>=1,<2", "pypdf>=4,<6"]

[project.optional-dependencies]
ui = ["gradio>=5,<6"]

[project.scripts]
kwiki = "knowledge_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.15.9",
    "ty>=0.0.31",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ty.environment]
root = ["./src"]

[tool.ty.rules]
all = "warn"

[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = false
output-format = "full"
